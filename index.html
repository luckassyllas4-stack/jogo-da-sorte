<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEGA RASPADINHA</title>
<style>
:root{--p:#f5c542;--bg:#14102b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow-x:hidden}
main{max-width:430px;margin:auto;text-align:center}h1{margin:.4em 0 0;color:var(--p)}
#relogio{opacity:.8;font-size:.9rem}.perfil{margin:10px 0}
#banners{height:120px;border-radius:14px;background:#251d4f center/cover;margin:10px 0}
.card{position:relative;width:100%;aspect-ratio:2/1;border-radius:18px;border:3px solid var(--p);box-shadow:0 0 24px #0008;overflow:hidden;background:#251d4f}
#res{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;padding:8px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
button{min-height:48px;width:100%;margin-top:14px;border:0;border-radius:24px;background:var(--p);font-weight:800;font-size:1rem}
#suporte{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--p);color:#000;display:none;align-items:center;justify-content:center;text-decoration:none;font-weight:800}
@media(prefers-reduced-motion:no-preference){.ganhou{animation:pulsa 1s infinite}}@keyframes pulsa{50%{transform:scale(1.12)}}
</style></head><body><main>
<h1 id="nome"></h1><div id="sub"></div><div id="relogio" aria-live="off"></div>
<div class="perfil">Olá, <b id="usuario"></b></div>
<div id="banners" role="img" aria-label="Banner"></div>
<h2 id="titulo"></h2>
<div class="card"><div id="res" aria-live="polite"></div><canvas id="cv" aria-label="Área para raspar"></canvas></div>
<button id="btn"></button><a id="suporte" target="_blank" rel="noopener">?</a>
</main>
<script type="module">
import {lerConfig,jogadaDemo,limpa,urlSegura} from "../compartilhado/store.js";
const $=i=>document.getElementById(i);let cfg,ban=0,ti;
async function aplica(){cfg=await lerConfig();
 document.documentElement.style.setProperty("--p",cfg.corPrimaria);document.documentElement.style.setProperty("--bg",cfg.corFundo);
 $("nome").textContent=limpa(cfg.nome);$("sub").textContent=limpa(cfg.subtitulo);$("titulo").textContent=limpa(cfg.titulo);$("btn").textContent=limpa(cfg.botao);
 const s=urlSegura(cfg.suporteUrl);$("suporte").style.display=s?"flex":"none";$("suporte").href=s||"#";
 const b=cfg.banners.filter(urlSegura);clearInterval(ti);const mostra=()=>{if(b.length)$("banners").style.backgroundImage=`url("${b[ban++%b.length]}")`};mostra();if(b.length>1)ti=setInterval(mostra,4000)}
function hora(){$("relogio").textContent=new Date().toLocaleString("pt-BR",{dateStyle:"full",timeStyle:"medium"})}
setInterval(hora,1000);hora();
let nome=localStorage.getItem("mr_nome")||limpa(prompt("Seu nome:")||"Visitante");localStorage.setItem("mr_nome",nome);$("usuario").textContent=nome;
const cv=$("cv"),ctx=cv.getContext("2d");let raspando=false,ocupado=false;
function cobre(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;
 const g=ctx.createLinearGradient(0,0,cv.width,cv.height);g.addColorStop(0,"#d9d9d9");g.addColorStop(.5,"#f5f5f5");g.addColorStop(1,"#a8a8a8");
 ctx.globalCompositeOperation="source-over";ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
 ctx.fillStyle="#555";ctx.font=`800 ${cv.width/11}px system-ui`;ctx.textAlign="center";ctx.fillText("RASPE AQUI!",cv.width/2,cv.height/1.8)}
function raspa(e){if(!raspando)return;const r=cv.getBoundingClientRect(),d=cv.width/r.width;
 ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc((e.clientX-r.left)*d,(e.clientY-r.top)*d,16*d,0,7);ctx.fill()}
cv.onpointerdown=e=>{raspando=true;cv.setPointerCapture(e.pointerId);raspa(e)};cv.onpointermove=raspa;cv.onpointerup=()=>raspando=false;
function nova(){if(ocupado)return;ocupado=true;const j=jogadaDemo();
 $("res").className=j.ganhou?"ganhou":"";$("res").textContent=j.ganhou?"VOCÊ GANHOU! "+j.premio:"NÃO FOI DESTA VEZ. TENTE NA PRÓXIMA!";cobre();setTimeout(()=>ocupado=false,500)}
$("btn").onclick=nova;addEventListener("resize",cobre);window.addEventListener("mr_cfg",aplica);
aplica();nova();
</script></body></html>
